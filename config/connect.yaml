# Zunia mobile - secure connection config
# Secrets via --dart-define or local env (never commit real project IDs to public forks if rotated)

schema_version: 1

wallet:
  name: Zunia
  short_name: Zunia
  description: Multi-chain Cosmos wallet
  url: https://zunialab.com
  icons:
    - https://raw.githubusercontent.com/Zunia-Lab/zunia-brand/main/png/icons/app/zunia-icon-512.png

# First-party Zunia connect through the relay (zunia.connect.v2, end-to-end encrypted)
# The wallet only pairs through trusted relays, because the relay reports which site created a session.
# Add relays at build time: --dart-define=ZUNIA_CONNECT_TRUSTED_RELAYS=wss://a,wss://b
# or --dart-define=CONNECT_WS_PUBLIC_URL=ws://192.168.1.10:8788 (debug builds also accept local network relays)
native_ws:
  protocol: zunia.connect.v2
  trusted_relays:
    - wss://api.zunialab.com
  ws_path: /v1/connect/ws
  http_path: /v1/connect/sessions
  unpaired_ttl_seconds: 600
  paired_ttl_seconds: 86400
  deep_link: zunia://connect
  # zunia://connect/wake?sid=<22>: brings a paired session up; carries no secret.
  wake_link: zunia://connect/wake
  # Optional pairing parameter ret=<url-encoded https: or app-scheme URL, <= 512 chars>:
  # where the wallet returns after an answer, for links opened on this phone.
  return_parameter: ret
  request_lifetime_seconds: 300
  max_frame_bytes: 524288

# WalletConnect Cloud project: https://cloud.walletconnect.com
walletconnect:
  version: 2
  # Replace before shipping. Use the same project ID across mobile + dashboard.
  project_id: ${WALLETCONNECT_PROJECT_ID}
  relay_url: wss://relay.walletconnect.com
  # CosmJS / Cosmos namespaces commonly used by dApps
  namespaces:
    cosmos:
      methods:
        - cosmos_getAccounts
        - cosmos_signAmino
        - cosmos_signDirect
        - cosmos_signArbitrary
      events:
        - accountsChanged
        - chainChanged
      # Empty = allow any chain the wallet enables; tighten in production if needed
      chains: []
  session:
    require_user_approval: true
    expire_on_disconnect: true
    # Unanswered requests get JSON-RPC error 8000 after this long.
    request_lifetime_seconds: 300

deep_links:
  # Custom scheme (always available; less secure than verified App / Universal Links)
  custom_schemes:
    - scheme: zunia
      # Any host: WalletConnect dApps also open a bare zunia:// to return here.
      hosts:
        - wc
        - connect
        - dapp
    - scheme: zuniamobile
      hosts:
        - wc
  # WalletConnect URI scheme (dApps open wc:... links)
  walletconnect_scheme: wc
  # Verified HTTPS links (require AASA + assetlinks on the website)
  universal_links:
    - https://zunialab.com/wc
    - https://zunialab.com/connect
    - https://zunialab.com/connect/wake
    - https://link.zunialab.com/wc
    - https://link.zunialab.com/connect
    - https://link.zunialab.com/connect/wake

security:
  # Only HTTPS for chain RPC / indexer / WC relay (localhost allowed in debug)
  cleartext_traffic: false
  allow_localhost_in_debug: true
  # Always show human-readable preview before signing
  require_tx_preview: true
  # Per-origin allowlist is empty until first user approval
  default_origin_policy: prompt
  # Reject sessions that request methods outside namespaces above
  strict_namespace: true

app_ids:
  android_application_id: com.zuniawallet.zunia_mobile
  ios_bundle_id: com.zuniawallet.zuniaMobile
  # Fill after Play App Signing / Apple Team setup (used in Digital Asset Links / AASA)
  android_sha256_cert_fingerprints: []
  apple_team_id: "" # e.g. ABCDE12345, required for apple-app-site-association appID
